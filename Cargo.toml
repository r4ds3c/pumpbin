[package]
name = "hostsight"
version = "0.1.0"
authors = ["b1n <b1n@b1n.io>"]
edition = "2021"
description = "HostSight is a host-centric Network Forensic Analysis Tool (NFAT)."
documentation = "https://github.com/pumpbin/pumpbin"
readme = "README.md"
homepage = "https://github.com/pumpbin/pumpbin"
repository = "https://github.com/pumpbin/pumpbin"
license = "MIT"
build = "build.rs"
default-run = "hostsight"

[[bin]]
name = "hostsight"
path = "src/main.rs"

[[bin]]
name = "hostsight-cli"
path = "src/bin/hostsight_cli.rs"

[features]
default = []
# Requires Npcap (Windows) or libpcap (Linux/macOS) at build/link time.
live-capture = ["dep:pcap"]

[dependencies]
anyhow = "1.0.86"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "5.0.1"
etherparse = "0.16"
md-5 = "0.10"
open = "5.1.4"
pcap = { version = "2", optional = true }
pcap-file = "2.0.0"
rfd = { version = "0.14.1", default-features = false, features = ["gtk3"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.120"
sha2 = "0.10"
thiserror = "1.0"
x509-parser = "0.16"

[dependencies.iced]
version = "0.13.0-dev"
git = "https://github.com/iced-rs/iced"
rev = "143f4c86caeb43cfff6573fe192c8eb877bb044c"
default-features = false
features = ["wgpu", "tiny-skia", "advanced", "svg", "tokio", "image"]

[package.metadata.winresource]
LegalCopyright = "Copyright (c) 2024-2026 HostSight contributors"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.17"

[dev-dependencies]
tempfile = "3.10.1"

[profile.release]
strip = true
opt-level = 3
lto = true
codegen-units = 1
